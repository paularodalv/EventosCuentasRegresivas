<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apertura del registro · Festival Nexo</title>
  <link rel="stylesheet" href="../../../assets/event-base.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="ev-header">
    <a class="ev-brand" href="../index.html">FESTIVAL NEXO</a>
    <a class="ev-back" href="../index.html">← Volver al evento</a>
  </header>
  <main class="cd-stage">
    <!-- 1) ORNAMENTOS: decorado propio del evento. Añade aquí tus formas, SVG o imágenes. -->
    <div class="cd-ornaments" aria-hidden="true">
      <span class="orn-orbit orn-orbit--a"></span>
      <span class="orn-orbit orn-orbit--b"></span>
      <div class="orn-eq"><span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span><span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span><span style="--i:16"></span><span style="--i:17"></span><span style="--i:18"></span><span style="--i:19"></span><span style="--i:20"></span><span style="--i:21"></span><span style="--i:22"></span><span style="--i:23"></span><span style="--i:24"></span><span style="--i:25"></span></div>
      <span class="cd-ring" style="--x:6%;--y:20%;--s:20px"></span>
      <span class="cd-dot" style="--x:92%;--y:26%;--s:10px"></span>
      <span class="cd-dot" style="--x:14%;--y:62%;--s:7px"></span>
    </div>

    <section class="cd-card" data-countdown
      data-target="2026-12-15T10:00:00+01:00"
      data-finished="¡Registro abierto!"
      data-finished-title="¡Registro abierto!">

      <!-- 2) SELLO: icono y palabra propios de esta cuenta regresiva. -->
      <div class="cd-sticker" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M6 12h28v6a3 3 0 0 0 0 6v6H6v-6a3 3 0 0 0 0-6z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="M24 13v3M24 19v3M24 25v3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>Registro</span>
      </div>

      <h1 class="cd-heading">
        <span class="cd-name">Apertura del registro</span>
        <!-- 3) TÍTULO: la frase que acompaña a los números. -->
        <span class="cd-title" data-title>Abre en</span>
      </h1>

      <!-- 4) FICHAS: data-shape = rounded (por defecto) | soft | circle | square -->
      <div class="countdown" data-shape="circle" aria-live="off">
        <div class="unit"><div class="tile"><strong data-days>--</strong></div><span>Días</span></div>
        <div class="unit"><div class="tile"><strong data-hours>--</strong></div><span>Horas</span></div>
        <div class="unit"><div class="tile"><strong data-minutes>--</strong></div><span>Minutos</span></div>
        <div class="unit"><div class="tile"><strong data-seconds>--</strong></div><span>Segundos</span></div>
      </div>

      <!-- 5) TEXTO, FECHA Y BOTÓN propios de esta cuenta regresiva. -->
      <p class="cd-desc">Cuando el contador llegue a cero empieza el registro de asistentes.</p>
      <p class="cd-message" data-message role="status"></p>
      <ul class="cd-meta">
        <li data-zone-date></li>
        <li data-local-date></li>
      </ul>
      <div class="cd-actions">
        <a class="cd-cta" href="../index.html" data-show-when="running">Ver todas las actividades</a>
        <a class="cd-cta cd-cta--solid" href="../index.html" data-show-when="finished" hidden>Volver al evento</a>
      </div>
    </section>
  </main>
  <footer class="ev-footer">Festival Nexo · Esta página pertenece únicamente a este evento.</footer>
  <script src="../../../assets/countdown.js"></script>
</body>
</html>
