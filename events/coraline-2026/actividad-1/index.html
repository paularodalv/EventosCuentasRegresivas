<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity 01 · El Otro Mundo</title>
  <link rel="stylesheet" href="../../../assets/event-base.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="ev-header">
    <a class="ev-brand" href="../index.html">EL OTRO MUNDO</a>
    <a class="ev-back" href="../index.html">← Volver al evento</a>
  </header>
  <main class="cd-stage">
    <div class="cd-ornaments" aria-hidden="true">
      <span class="orn-tunnel"></span>
      <span class="cd-ring" style="--x:7%;--y:20%;--s:22px"></span>
      <span class="cd-dot" style="--x:91%;--y:26%;--s:10px"></span>
    </div>
 
    <section class="cd-card" data-countdown
             data-target="2026-11-25T00:00:00+01:00"
             data-end="2026-11-30T23:59:59+01:00"
             data-active-title="Ends in"
             data-active="Activity 01 open since November 25, 2026."
             data-finished="Activity 01 closed!"
             data-finished-title="Closed">
 
      <div class="cd-sticker" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.8"/>
          <circle cx="15" cy="15" r="2.2" fill="currentColor"/>
          <circle cx="25" cy="15" r="2.2" fill="currentColor"/>
          <circle cx="15" cy="25" r="2.2" fill="currentColor"/>
          <circle cx="25" cy="25" r="2.2" fill="currentColor"/>
        </svg>
        <span>Act. 01</span>
      </div>
 
      <h1 class="cd-heading">
        <span class="cd-name">Activity 01 · 25 nov – 30 nov 2026</span>
        <span class="cd-title" data-title>Starts in</span>
      </h1>
 
      <div class="countdown" data-shape="circle" aria-live="off">
        <div class="unit"><div class="tile"><strong data-days>--</strong></div><span>Días</span></div>
        <div class="unit"><div class="tile"><strong data-hours>--</strong></div><span>Horas</span></div>
        <div class="unit"><div class="tile"><strong data-minutes>--</strong></div><span>Minutos</span></div>
        <div class="unit"><div class="tile"><strong data-seconds>--</strong></div><span>Segundos</span></div>
      </div>
 
      <p class="cd-desc">It begins on November 25, 2026, and ends on November 30, 2026.</p>
      <p class="cd-message" data-message role="status"></p>
      <ul class="cd-meta">
        <li data-zone-date></li>
        <li data-local-date></li>
      </ul>
      <div class="cd-actions">
        <a class="cd-cta" href="../index.html" data-show-when="upcoming">See all activities</a>
        <a class="cd-cta cd-cta--solid" href="../index.html" data-show-when="active" hidden>Participate now</a>
        <a class="cd-cta" href="../index.html" data-show-when="finished" hidden>Go back to the event</a>
      </div>
    </section>
  </main>
  <footer class="ev-footer">El Otro Mundo · Roleplay ES Ducks.</footer>
  <script src="../../../assets/countdown.js"></script>
</body>
</html>
