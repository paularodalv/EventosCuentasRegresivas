<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration · The Other World</title>
  <link rel="stylesheet" href="../../../assets/event-base.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="ev-header">
    <a class="ev-brand" href="../index.html">THE OTHER WORLD</a>
    <a class="ev-back" href="../index.html">← Back to event</a>
  </header>
  <main class="cd-stage">
    <!-- 1) ORNAMENTOS: decorado propio del evento. Añade aquí tus formas, SVG o imágenes. -->
    <div class="cd-ornaments" aria-hidden="true">
      <div class="orn-sun"></div>
      <svg class="orn-ribbons" viewBox="0 0 1200 400" preserveAspectRatio="none">
        <defs>
          <linearGradient id="rb1" x1="0" x2="1"><stop offset="0" stop-color="#7f62e0" stop-opacity="0"/><stop offset=".5" stop-color="#f59a82"/><stop offset="1" stop-color="#ffbf9f" stop-opacity="0"/></linearGradient>
          <linearGradient id="rb2" x1="0" x2="1"><stop offset="0" stop-color="#ffbf9f" stop-opacity="0"/><stop offset=".5" stop-color="#9b7bf0"/><stop offset="1" stop-color="#f59a82" stop-opacity="0"/></linearGradient>
        </defs>
        <g>
          <path d="M0 270C190 140 400 350 640 215S1010 130 1200 250" stroke="url(#rb1)" stroke-width="3"/>
          <path d="M0 320C220 210 420 380 660 275S1020 210 1200 310" stroke="url(#rb2)" stroke-width="2.5"/>
          <path d="M0 225C170 110 420 290 650 170S1020 90 1200 205" stroke="url(#rb1)" stroke-width="1.5" opacity=".6"/>
        </g>
      </svg>
      <span class="cd-ring" style="--x:7%;--y:16%;--s:22px"></span>
      <span class="cd-ring" style="--x:90%;--y:62%;--s:16px"></span>
      <span class="cd-dot" style="--x:16%;--y:70%;--s:9px"></span>
      <span class="cd-dot" style="--x:82%;--y:14%;--s:7px"></span>
      <span class="cd-dot" style="--x:48%;--y:7%;--s:6px"></span>
    </div>

    <section class="cd-card" data-countdown
      data-target="2026-12-01T09:00:00+01:00"
      data-finished="Registration is out!"
      data-finished-title="Registration is out!">

      <!-- 2) SELLO: icono y palabra propios de esta cuenta regresiva. -->
      <div class="cd-sticker" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M6 12h28v6a3 3 0 0 0 0 6v6H6v-6a3 3 0 0 0 0-6z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="M24 13v3M24 19v3M24 25v3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>Registro</span>
      </div>

      <h1 class="cd-heading">
        <span class="cd-name">Apertura del registro</span>
        <!-- 3) TÍTULO: la frase que acompaña a los números. -->
        <span class="cd-title" data-title>Abre en</span>
      </h1>

      <!-- 4) FICHAS: data-shape = rounded (por defecto) | soft | circle | square -->
      <div class="countdown" data-shape="soft" aria-live="off">
        <div class="unit"><div class="tile"><strong data-days>--</strong></div><span>Días</span></div>
        <div class="unit"><div class="tile"><strong data-hours>--</strong></div><span>Horas</span></div>
        <div class="unit"><div class="tile"><strong data-minutes>--</strong></div><span>Minutos</span></div>
        <div class="unit"><div class="tile"><strong data-seconds>--</strong></div><span>Segundos</span></div>
      </div>

      <!-- 5) TEXTO, FECHA Y BOTÓN propios de esta cuenta regresiva. -->
      <p class="cd-desc">Cuando el contador llegue a cero se abre el periodo de registro.</p>
      <p class="cd-message" data-message role="status"></p>
      <ul class="cd-meta">
        <li data-zone-date></li>
        <li data-local-date></li>
      </ul>
      <div class="cd-actions">
        <a class="cd-cta" href="../index.html" data-show-when="running">Ver todas las actividades</a>
        <a class="cd-cta cd-cta--solid" href="../index.html" data-show-when="finished" hidden>Volver al evento</a>
      </div>
    </section>
  </main>
  <footer class="ev-footer">Encuentro Aurora · Esta página pertenece únicamente a este evento.</footer>
  <script src="../../../assets/countdown.js"></script>
</body>
</html>
